apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-hello-deployment
  labels:
    app: java-hello
spec:
  replicas: 1
  selectors:
    matchLabels:
      app: java-hello
  templates:
    metadata:
      labels:
        app: java-hello
  containers:
    - name: java-hello-container
      image: ditiss1/hello:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: java-hello-service
spec:
  type: ClusterIP
  selector:
    app: java-hello
  ports:
  - port: 8092

